import 'package:flutter/material.dart';
import 'package:image_picker/image_picker.dart';

void main() {
runApp(const MyApp());
}

class MyApp extends StatelessWidget {
const MyApp({super.key});

@override
Widget build(BuildContext context) {
return MaterialApp(
title: 'Уменьшить фото и PDF',
debugShowCheckedModeBanner: false,
theme: ThemeData(
colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue),
useMaterial3: true,
),
home: const HomePage(),
);
}
}

class HomePage extends StatelessWidget {
const HomePage({super.key});

@override
Widget build(BuildContext context) {
return Scaffold(
appBar: AppBar(
title: const Text('Главная'),
centerTitle: true,
),
body: Center(
child: Column(
mainAxisAlignment: MainAxisAlignment.center,
children: [
ElevatedButton(
onPressed: () {
Navigator.push(
context,
MaterialPageRoute(builder: (context) => const CompressScreen()),
);
},
style: ElevatedButton.styleFrom(minimumSize: const Size(200, 60)),
child: const Text('Сжать фото', style: TextStyle(fontSize: 18)),
),
const SizedBox(height: 20),
ElevatedButton(
onPressed: () {},
style: ElevatedButton.styleFrom(minimumSize: const Size(200, 60)),
child: const Text('В PDF', style: TextStyle(fontSize: 18)),
),
const SizedBox(height: 20),
ElevatedButton(
onPressed: () {},
style: ElevatedButton.styleFrom(minimumSize: const Size(200, 60)),
child: const Text('Убрать фон', style: TextStyle(fontSize: 18)),
),
],
),
),
);
}
}

class CompressScreen extends StatefulWidget {
const CompressScreen({super.key});

@override
State<CompressScreen> createState() => _CompressScreenState();
}

class _CompressScreenState extends State<CompressScreen> {
final ImagePicker _picker = ImagePicker();
XFile? _selectedImage;

Future<void> _pickImage() async {
final XFile? image = await _picker.pickImage(source: ImageSource.gallery);
if (image != null) {
setState(() {
_selectedImage = image;
});
}
}

@override
Widget build(BuildContext context) {
return Scaffold(
appBar: AppBar(
title: const Text('Сжать фото'),
),
body: Center(
child: Column(
mainAxisAlignment: MainAxisAlignment.center,
children: [
_selectedImage == null
? const Icon(Icons.image, size: 100, color: Colors.grey)
: Image.network(_selectedImage!.path, height: 200),

const SizedBox(height: 20),

ElevatedButton(
onPressed: _pickImage,
child: const Text('Выбрать из галереи'),
),
],
),
),
);
}
}